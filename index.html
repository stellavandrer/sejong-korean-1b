const GR_1A=[[1,[["-이에요/예요","Pour dire « c’est… » ou « je suis… » après un nom. Après une consonne : 이에요 ; après une voyelle : 예요. La question a la même forme, avec une intonation montante.",[["저는 학생이에요.","Je suis élève."],["제 친구는 가수예요.","Mon ami est chanteur."]]],["은/는","Marque le thème de la phrase : « quant à… ». Après une consonne : 은 ; après une voyelle : 는. On l’utilise pour se présenter ou pour comparer.",[["저는 안나예요.","Moi, c’est Anna."],["선생님은 한국 사람이에요.","Le professeur est coréen."]]]]],[2,[["이/가","Marque le sujet. Après une consonne : 이 ; après une voyelle : 가. Dans une question avec 뭐, 누구 ou 어디, on utilise souvent 이/가.",[["전화번호가 뭐예요?","Quel est ton numéro de téléphone ?"],["교실이 몇 층이에요?","La salle de classe est à quel étage ?"]]],["이/가 아니에요","« Ce n’est pas… », « je ne suis pas… ». Après une consonne : 이 아니에요 ; après une voyelle : 가 아니에요.",[["저는 의사가 아니에요.","Je ne suis pas médecin."],["물이 아니에요. 주스예요.","Ce n’est pas de l’eau. C’est du jus."]]]]],[3,[["이, 그, 저","« Ce, cette » devant un nom. 이 : près de moi ; 그 : près de toi ou déjà mentionné ; 저 : loin de nous deux.",[["이 책은 제 책이에요.","Ce livre est mon livre."],["저 사람은 누구예요?","Qui est cette personne là-bas ?"]]],["에 있다 / 에 없다","« Il y a » ou « il n’y a pas » à un endroit : lieu + 에 + 있어요 / 없어요. Pour préciser la position : 책상 위에, 의자 뒤에…",[["가방이 책상 옆에 있어요.","Le sac est à côté du bureau."],["교실에 피아노가 없어요.","Il n’y a pas de piano dans la classe."]]]]],[4,[["-아요/어요","Le présent poli. Si la dernière voyelle de la racine est ㅏ ou ㅗ : -아요 ; sinon : -어요 ; 하다 donne 해요. Les voyelles se contractent souvent : 보다 → 봐요, 마시다 → 마셔요.",[["저는 한국어를 공부해요.","J’étudie le coréen."],["친구가 책을 읽어요.","Mon ami lit un livre."],["동생이 우유를 마셔요.","Mon petit frère boit du lait."]]],["을/를","Marque le complément d’objet direct. Après une consonne : 을 ; après une voyelle : 를.",[["빵을 먹어요.","Je mange du pain."],["영화를 봐요.","Je regarde un film."]]]]],[5,[["에 가다","« Aller à » un lieu : lieu + 에 + 가다. On dit aussi 에 오다 (venir à).",[["마트에 가요.","Je vais au supermarché."],["내일 학교에 와요?","Tu viens à l’école demain ?"]]],["하고","« Et » ou « avec » entre deux noms. Il se colle au premier nom, sans règle de voyelle.",[["빵하고 우유를 사요.","J’achète du pain et du lait."],["친구하고 영화를 봐요.","Je regarde un film avec un ami."]]]]],[6,[["Les compteurs (단위 명사)","Pour compter : nom + nombre coréen natif + compteur (개, 명, 마리, 잔, 병, 권, 장, 살). Devant le compteur, 하나, 둘, 셋, 넷, 스물 deviennent 한, 두, 세, 네, 스무.",[["사과 다섯 개 주세요.","Cinq pommes, s’il vous plaît."],["학생이 두 명 있어요.","Il y a deux élèves."],["고양이가 세 마리 있어요.","Il y a trois chats."]]],["-(으)세요","Demande polie : « veuillez… », « … s’il vous plaît ». Après une voyelle : -세요 ; après une consonne : -으세요.",[["여기 앉으세요.","Asseyez-vous ici."],["책을 펴세요.","Ouvrez votre livre."]]]]],[7,[["에 (le temps)","Après une heure, un jour ou une date : « à », « le ». Mais 오늘, 내일, 어제 et 지금 ne prennent pas 에.",[["일곱 시에 시작해요.","Ça commence à sept heures."],["토요일에 친구를 만나요.","Samedi, je vois un ami."]]],["○ 시 ○ 분","L’heure se dit avec les nombres coréens natifs (한 시, 두 시…), les minutes avec les nombres sino-coréens (십 분, 삼십 분). 반 veut dire « et demie ».",[["지금 세 시 십 분이에요.","Il est trois heures dix."],["아홉 시 반에 수업이 있어요.","J’ai cours à neuf heures et demie."]]]]],[8,[["안","La négation simple : 안 se place devant le verbe ou l’adjectif. Avec un verbe comme 공부하다, il se glisse avant 하다 : 공부 안 해요.",[["날씨가 안 좋아요.","Il ne fait pas beau."],["오늘은 운동 안 해요.","Aujourd’hui, je ne fais pas de sport."]]],["Le ㅂ irrégulier","Pour la plupart des adjectifs en ㅂ, le ㅂ devient 우 devant une voyelle : 덥다 → 더워요, 춥다 → 추워요, 맵다 → 매워요. Exceptions : 입다 → 입어요, 좁다 → 좁아요.",[["날씨가 더워요.","Il fait chaud."],["김치가 좀 매워요.","Le kimchi est un peu épicé."]]]]],[9,[["에서","« À » pour le lieu où l’on fait quelque chose : lieu + 에서 + verbe d’action. À ne pas confondre avec 에 (destination ou présence).",[["공원에서 산책해요.","Je me promène au parc."],["도서관에서 책을 읽어요.","Je lis à la bibliothèque."]]],["-았/었-","Le passé. Après ㅏ ou ㅗ : -았어요 ; sinon : -었어요 ; 하다 donne 했어요.",[["어제 공원에서 산책했어요.","Hier, je me suis promené(e) au parc."],["친구하고 김밥을 만들었어요.","J’ai préparé des kimbaps avec un ami."],["주말에 집에서 쉬었어요.","Ce week-end, je me suis reposé(e) à la maison."]]]]],[10,[["-고 싶다","« Vouloir » faire quelque chose : racine du verbe + 고 싶어요, sans règle de voyelle.",[["비빔밥을 먹고 싶어요.","Je veux manger un bibimbap."],["방학에 제주도에 가고 싶어요.","Pendant les vacances, je veux aller à Jeju."]]],["-(으)ㄹ까요?","Proposer : « et si on… ? ». Après une voyelle : -ㄹ까요 ; après une consonne : -을까요 ; avec un verbe en ㄹ, on ajoute seulement 까요 (만들까요).",[["우리 같이 놀이공원에 갈까요?","Et si on allait ensemble au parc d’attractions ?"],["같이 점심을 먹을까요?","On déjeune ensemble ?"]]]]]];
const GT_1A={"1":["Pour choisir 이에요 ou 예요, regarde seulement la dernière lettre du nom : 학생이에요, 의사예요.","Après 저, on met 는 (저는), jamais 은 : 저 se termine par une voyelle."],"2":["Pour un numéro de téléphone, on lit chiffre par chiffre et le 0 se dit souvent 공 : 010 se dit 공일공.","Pour une information nouvelle ou une question avec 뭐, préfère 이/가 à 은/는 : 이름이 뭐예요?"],"3":["En coréen, on part du repère puis on donne la position : 책상 위에 = « sur le bureau ».","있어요 veut aussi dire « avoir » : 우산이 있어요 = j’ai un parapluie."],"4":["Regarde la dernière voyelle de la racine : 보다 → 봐요, 먹다 → 먹어요.","듣다 devient 들어요 au présent : 음악을 들어요."],"5":["에 dit où l’on va : 학교에 가요. On ne met pas 을/를 avec 가다.","하고 relie seulement des noms, pas des verbes : 빵하고 우유."],"6":["Pour l’âge, on compte en coréen natif avec 살 : 스무 살 (20 ans).","Devant un compteur, on dit 한 개, pas 하나 개."],"7":["Heures en coréen natif, minutes en sino-coréen : 두 시 삼십 분.","Juin et octobre sont irréguliers : 유월 (pas 육월) et 시월 (pas 십월)."],"8":["Avec 공부하다, 안 se place juste avant 하다 : 공부 안 해요.","입다 et 좁다 gardent leur ㅂ : 입어요, 좁아요."],"9":["에서 = lieu d’une action (공원에서 산책해요) ; 에 = destination ou présence (공원에 가요, 공원에 있어요).","Au passé, 하다 devient 했어요 : 청소했어요, 운동했어요."],"10":["Avec -고 싶다, la racine ne change jamais : 먹고 싶어요, 가고 싶어요.","On répond souvent à -(으)ㄹ까요? par 좋아요 ! ou par 네, 같이 가요."]};

const GR_2A=[[1,[["(이)라고 하다","Pour donner un nom ou dire comment s’appelle quelque chose. Après une consonne : 이라고 해요 ; après une voyelle : 라고 해요.",[["저는 안나라고 해요.","Je m’appelle Anna."],["이 음식은 비빔밥이라고 해요.","Ce plat s’appelle bibimbap."]]],["-는 (verbe + nom)","Pour décrire un nom avec un verbe au présent : racine + 는 + nom. Avec un verbe en ㄹ, le ㄹ tombe : 만들다 → 만드는.",[["저는 프로그램을 만드는 일을 해요.","Mon travail, c’est de créer des logiciels."],["한국어를 가르치는 선생님이에요.","C’est un professeur qui enseigne le coréen."]]]]],[2,[["-거나 / (이)나","« Ou ». Entre deux verbes : racine + 거나. Entre deux noms : 이나 après une consonne, 나 après une voyelle.",[["주말에 등산을 하거나 운동 모임에 가요.","Le week-end, je fais de la randonnée ou je vais à mon club de sport."],["돈가스나 카레를 먹어요.","Je mange un porc pané ou un curry."]]],["-(으)ㄹ까요? (demander un avis)","En 1A, -(으)ㄹ까요? servait à proposer. Il sert aussi à demander l’avis de l’autre : « qu’est-ce que je… ? », « tu crois que… ? ».",[["내일 뭘 입을까요?","Qu’est-ce que je mets demain, à ton avis ?"],["저하고 취미가 같은 친구가 있을까요?","Tu crois qu’il y a quelqu’un qui a les mêmes loisirs que moi ?"]]]]],[3,[["마다","« Chaque », « tous les » : nom + 마다, sans règle de voyelle.",[["요즘 아침마다 회의가 있어요.","Ces temps-ci, j’ai une réunion tous les matins."],["일요일마다 데이트를 해요.","J’ai un rendez-vous amoureux tous les dimanches."]]],["-(으)ㄹ 때","« Quand », « lorsque ». Après une voyelle ou ㄹ : -ㄹ 때 ; après une consonne : -을 때.",[["출퇴근할 때 음악을 들어요.","J’écoute de la musique pendant mes trajets."],["시간이 없을 때 김밥을 먹어요.","Quand je n’ai pas le temps, je mange un kimbap."]]]]],[4,[["-기로 하다","« Décider de », « convenir de » : racine + 기로 하다, souvent au passé : 하기로 했어요.",[["오늘 저녁에 여자 친구를 만나기로 했어요.","J’ai prévu de voir ma petite amie ce soir."],["주말에 시내에서 놀기로 했어요.","On a décidé de sortir en ville ce week-end."]]],["에다가","« Avec », « en plus de » : on ajoute un élément à un autre (vêtements, ingrédients). Nom + 에다가.",[["청바지에다가 티셔츠를 입으려고 해요.","Je compte mettre un tee-shirt avec un jean."],["블라우스에다가 정장 바지를 입어요.","Je mets un pantalon de costume avec un chemisier."]]]]],[5,[["-기가 좋다","« C’est agréable, pratique de… » : racine + 기가 좋다. Pour l’inverse : -기가 불편하다.",[["거실 창문이 커서 경치를 구경하기가 좋아요.","La fenêtre du salon est grande, c’est agréable pour admirer la vue."],["부엌이 넓어서 요리하기가 좋아요.","La cuisine est spacieuse, c’est pratique pour cuisiner."]]],["-지 않다, -지 못하다","La négation longue : racine + 지 않다 (comme 안) et racine + 지 못하다 (comme 못, impossibilité).",[["방이 별로 지저분하지 않아요.","La chambre n’est pas très en désordre."],["냉장고가 무거워서 혼자 버리지 못해요.","Le frigo est lourd, je ne peux pas le jeter tout seul."]]]]],[6,[["-(으)면서","« En faisant… » : deux actions en même temps, avec le même sujet. Après une voyelle ou ㄹ : -면서 ; après une consonne : -으면서.",[["커피를 마시면서 음악을 들어요.","J’écoute de la musique en buvant un café."],["회사에 다니면서 외국어를 공부해요.","J’étudie une langue étrangère tout en travaillant."]]],["-지요? (-죠?)","Pour vérifier ce qu’on pense déjà : « …, n’est-ce pas ? ». À l’oral, on dit souvent -죠?.",[["이 카페 분위기가 좋지요?","L’ambiance de ce café est sympa, n’est-ce pas ?"],["오늘 날씨가 춥죠?","Il fait froid aujourd’hui, hein ?"]]]]],[7,[["-(으)면","« Si », « quand » : une condition ou une habitude. Après une voyelle ou ㄹ : -면 ; après une consonne : -으면.",[["스트레스를 받으면 가슴이 답답해요.","Quand je suis stressé(e), j’ai la poitrine serrée."],["피곤하면 일찍 자세요.","Si tu es fatigué(e), couche-toi tôt."]]],["Le ㅅ irrégulier","Pour 낫다, 짓다, 젓다 et 붓다, le ㅅ tombe devant une voyelle : 낫다 → 나아요, 짓다 → 지어요. 씻다 et 웃다 restent réguliers : 씻어요, 웃어요.",[["약을 먹어서 감기가 다 나았어요.","J’ai pris des médicaments, mon rhume est guéri."],["우유에 꿀을 넣고 저으세요.","Mettez du miel dans le lait et remuez."]]]]],[8,[["-는데 / -(으)ㄴ데","Pour poser le contexte avant une question, une demande ou un contraste. Verbe : -는데 ; adjectif : -(으)ㄴ데 ; 있다, 없다 : -는데.",[["머리가 좀 아픈데 혹시 약이 있어요?","J’ai un peu mal à la tête, tu n’aurais pas un médicament ?"],["늦게 자는 습관을 고치고 싶은데 어떻게 하면 돼요?","Je veux arrêter de me coucher tard, comment faire ?"]]],["-아/어 보다 (essayer)","« Essayer de » : racine + 아/어 보다. Avec -세요, c’est un conseil : 해 보세요 (essaie de…).",[["잠이 안 오면 가벼운 운동을 해 보세요.","Si tu n’arrives pas à dormir, essaie de faire un peu de sport."],["한국 음식을 먹어 보세요.","Essaie de goûter la cuisine coréenne."]]]]],[9,[["-는/(으)ㄴ/(으)ㄹ 것 같다","La supposition : « on dirait que », « il me semble que ». Verbe au présent : -는 것 같다 ; adjectif : -(으)ㄴ 것 같다 ; avenir : -(으)ㄹ 것 같다.",[["이 국은 좀 짠 것 같아요.","Cette soupe me semble un peu salée."],["비가 올 것 같아요.","On dirait qu’il va pleuvoir."]]],["-는 게 어때요?","Suggérer : « et si tu… ? », « pourquoi ne pas… ? » : racine + 는 게 어때요?",[["그럼 칼국수를 먹는 게 어때요?","Alors, pourquoi ne pas manger des kalguksu ?"],["현금으로 계산하는 게 어때요?","Et si tu payais en espèces ?"]]]]],[10,[["Le ㅎ irrégulier","Pour les adjectifs de couleur et 어떻다, le ㅎ tombe. Devant un nom : 하얀, 까만, 빨간. Au présent : 하얘요, 까매요, 빨개요, 어때요. 좋다 reste régulier : 좋아요.",[["저 까만 구두는 어때요?","Et ces chaussures noires, là-bas ?"],["하늘이 파래요.","Le ciel est bleu."]]],["-(으)면 좋겠다","Exprimer un souhait : « ce serait bien si… », « j’aimerais que… ».",[["디자인이 더 단순하면 좋겠어요.","J’aimerais que le design soit plus simple."],["창문을 좀 열면 좋겠어요.","Ce serait bien d’ouvrir un peu la fenêtre."]]]]],[11,[["-(으)ㄴ 적이 있다 / 없다","Une expérience : « avoir déjà… » ou « n’avoir jamais… ». Après une voyelle : -ㄴ 적이 ; après une consonne : -은 적이.",[["한국을 여행한 적이 있어요?","Tu as déjà voyagé en Corée ?"],["동대문시장에 간 적이 없어요.","Je ne suis jamais allé(e) au marché de Dongdaemun."]]],["동안","« Pendant » une durée : durée + 동안.",[["방학 동안 한국에서 여행했어요.","J’ai voyagé en Corée pendant les vacances."],["일주일 동안 서울에 있을 거예요.","Je serai à Séoul pendant une semaine."]]]]],[12,[["-아/어 보다 (expérience)","Au passé, -아/어 봤어요 raconte une expérience : « j’ai essayé », « j’ai fait l’expérience de ».",[["박물관에서 도장을 만들어 봤어요.","J’ai fabriqué un sceau au musée."],["번지 점프를 해 봤어요?","Tu as déjà fait du saut à l’élastique ?"]]],["-(으)ㄴ (verbe au passé + nom)","Pour décrire un nom par une action passée : racine + (으)ㄴ + nom. Après une voyelle : -ㄴ ; après une consonne : -은.",[["이 사진은 남산에서 찍은 사진이에요.","Cette photo, je l’ai prise sur le mont Namsan."],["백화점에서 산 옷이 마음에 들어요.","J’aime le vêtement que j’ai acheté au grand magasin."]]]]]];
const GT_2A={"1":["Pour se présenter poliment, 저는 안나라고 해요 est un peu plus formel que 저는 안나예요.","Avec un verbe en ㄹ, le ㄹ disparaît devant 는 : 만들다 → 만드는, 살다 → 사는."],"2":["-거나 relie des verbes, (이)나 relie des noms : 영화를 보거나 책을 읽어요, mais 영화나 책.","-(으)ㄹ까요? sert à proposer (같이 갈까요?) ou à demander un avis (뭘 입을까요?)."],"3":["마다 veut dire « tous les » : 아침마다, 주말마다.","On ne dit pas 때마다 après un nom de temps : on dit 아침마다, pas 아침 때마다."],"4":["-기로 했어요 annonce une décision ou un rendez-vous fixé : 만나기로 했어요.","에다가 ajoute un élément à un autre : surtout pour les vêtements et la nourriture."],"5":["-지 않다 a le même sens que 안 + verbe : 먹지 않아요 = 안 먹어요.","별로 et 전혀 vont toujours avec une négation : 별로 안 좋아요, 전혀 몰라요."],"6":["Avec -(으)면서, les deux actions ont le même sujet et se font en même temps.","-지요? s’utilise quand on pense que l’autre est d’accord : 맛있지요?"],"7":["-(으)면 peut dire « si » (une condition) ou « chaque fois que » (une habitude).","씻다 et 웃다 ne sont pas irréguliers : 씻어요, 웃어요."],"8":["-는데 donne la situation, puis on demande ou on propose quelque chose.","해 보세요 est un conseil poli : « essaie de… »."],"9":["-는 것 같다 pour ce qui se passe maintenant, -(으)ㄹ 것 같다 pour une supposition sur l’avenir.","-는 게 어때요? est une suggestion douce, plus polie qu’un ordre en -(으)세요."],"10":["Les couleurs en ㅎ perdent leur ㅎ : 빨갛다 → 빨간 장미, 빨개요.","-(으)면 좋겠다 exprime un souhait poli : pratique pour demander quelque chose en magasin."],"11":["Pour une expérience, on ajoute souvent -아/어 보다 : 가 본 적이 있어요 (j’y suis déjà allé).","동안 se place après une durée : 일주일 동안, 방학 동안."],"12":["-아/어 봤어요 raconte une expérience vécue : 먹어 봤어요 (j’ai goûté).","-(으)ㄴ + nom pour une action passée, -는 + nom pour une action présente : 산 옷 (le vêtement acheté), 사는 옷 (le vêtement que j’achète)."]};

const GR_2B=[[1,[["-(으)ㄹ래요?","Demander ce que l’autre veut faire, ou proposer : « tu veux… ? ». Après une voyelle ou ㄹ : -ㄹ래요 ; après une consonne : -을래요. Sans point d’interrogation, il dit ce que je veux faire.",[["이번 주 금요일에 동아리 모임 할래요?","Tu veux qu’on fasse la réunion du club ce vendredi ?"],["여기 잠깐 앉을래요?","Tu veux t’asseoir un instant ici ?"]]],["-(으)ㄹ게요","Promettre ou annoncer ce que je vais faire, en pensant à l’autre : « je vais… », « je te… ».",[["좋은 노래를 찾아볼게요.","Je vais chercher de bonnes chansons."],["내일 답장할게요.","Je te répondrai demain."]]]]],[2,[["에서부터","« Depuis », « à partir de » un lieu ou un moment. Souvent avec 까지 : 에서부터 … 까지.",[["세종학당에서부터 걸어서 10분쯤 걸려요.","Depuis l’Institut Sejong, ça prend environ 10 minutes à pied."],["역에서부터 학교까지 걸어갔어요.","J’ai marché de la gare jusqu’à l’école."]]],["-(으)ㄹ (verbe + nom, à venir)","Pour décrire un nom par une action à venir : racine + (으)ㄹ + nom. 할 일, 갈 곳, 먹을 음식…",[["행사에 참석할 사람은 연락 주세요.","Ceux qui participeront à l’événement, contactez-moi."],["내일 할 일이 많아요.","J’ai beaucoup de choses à faire demain."]]]]],[3,[["-(으)시- (l’honorifique)","Quand le sujet est une personne qu’on respecte, on ajoute -(으)시- au verbe : -(으)세요 au présent, -(으)셨어요 au passé. Le sujet prend 께서 au lieu de 이/가.",[["할머니께서 직접 만드신 목걸이예요.","C’est un collier que ma grand-mère a fait elle-même."],["할머니께서 신문을 읽으세요.","Ma grand-mère lit le journal."]]],["에게만, 에게도","On ajoute 만 (seulement) ou 도 (aussi) après 에게 : 친구에게만, 동생에게도.",[["이 이야기는 친구에게만 했어요.","Je n’ai raconté cette histoire qu’à mon ami."],["동생에게도 선물을 줬어요.","J’ai aussi offert un cadeau à mon petit frère."]]]]],[4,[["-다가","Une action en cours est interrompue par une autre : « en train de…, puis ». Racine + 다가, avec le même sujet.",[["세종학당에 오다가 중학교 때 친구를 만났어요.","En venant à l’Institut Sejong, j’ai croisé un ami du collège."],["음악을 듣다가 잠이 들었어요.","Je me suis endormi(e) en écoutant de la musique."]]],["-아/어 주다","Faire quelque chose pour quelqu’un : racine + 아/어 주다. Pour demander un service : -아/어 주세요.",[["가방을 들어 줄게요.","Je vais porter ton sac."],["길을 좀 알려 주세요.","Indiquez-moi le chemin, s’il vous plaît."]]]]],[5,[["-네요","Réagir à ce qu’on découvre sur le moment : « tiens… ! », « dis donc… ».",[["한국어 발음이 정말 좋네요.","Ta prononciation coréenne est vraiment bonne !"],["이 공연장 정말 크네요!","Cette salle est vraiment grande !"]]],["-지 말다","Demander de ne pas faire : racine + 지 마세요 (poli) ou 지 맙시다 (« ne faisons pas »).",[["공연 중에 핸드폰을 사용하지 마세요.","N’utilisez pas votre téléphone pendant le spectacle."],["공연 중에 떠들지 마세요.","Ne bavardez pas pendant le spectacle."]]]]],[6,[["-아도/어도 되다","Demander ou donner une permission : « est-ce que je peux… ? », « tu peux… ».",[["여기에서 노트북을 사용해도 돼요?","Je peux utiliser mon ordinateur portable ici ?"],["네, 사용해도 돼요.","Oui, vous pouvez."]]],["-(으)면 안 되다","Une interdiction, une règle : « il ne faut pas… ». Racine + (으)면 안 돼요.",[["여기에서 사진을 찍으면 안 돼요.","Il est interdit de prendre des photos ici."],["여기에서 뛰면 안 돼요.","Il ne faut pas courir ici."]]]]],[7,[["에게서 / 한테서 / 께","« De la part de » quelqu’un : 에게서 (plutôt écrit) ou 한테서 (oral). 께 est la forme respectueuse de 에게 (« à » une personne respectée).",[["마리 씨한테서 그 친구 이야기를 들었어요.","J’ai entendu parler de cet ami par Marie."],["할머니께 편지를 보냈어요.","J’ai envoyé une lettre à ma grand-mère."]]],["-(으)니까 (découverte)","Après une action, -(으)니까 peut dire « quand j’ai…, j’ai découvert que… ». La suite est souvent au passé.",[["문을 여니까 고양이가 있었어요.","Quand j’ai ouvert la porte, il y avait un chat."],["밖에 나가니까 비가 오고 있었어요.","Quand je suis sorti(e), il pleuvait."]]]]],[8,[["-는데 / -(으)ㄴ데 (contraste)","Opposer deux situations : « …, mais », « alors que… ». Verbe : -는데 ; adjectif : -(으)ㄴ데 ; au passé : -았/었는데.",[["어렸을 때는 머리가 길었는데 지금은 짧은 머리가 편해요.","Petite, j’avais les cheveux longs, mais maintenant je préfère les cheveux courts."],["어렸을 때는 키가 작았는데 지금은 커요.","Enfant, j’étais petit(e), mais maintenant je suis grand(e)."]]],["밖에","« Ne… que » : nom + 밖에, toujours suivi d’une négation (없다, 안, 못, 모르다).",[["돈이 천 원밖에 없어요.","Je n’ai que mille wons."],["저는 축구밖에 몰라요.","Je ne connais que le foot."]]]]],[9,[["-기 때문에","La cause, un peu plus formelle que -아서/어서 : racine + 기 때문에. Avec un nom : nom + 때문에.",[["기숙사는 규칙이 많기 때문에 조금 불편해요.","Il y a beaucoup de règles à la résidence, alors c’est un peu contraignant."],["핸드폰이 고장 났기 때문에 연락을 못 했어요.","Mon téléphone était en panne, c’est pour ça que je n’ai pas pu te contacter."]]],["-는데요 / -(으)ㄴ데요","Finir la phrase en douceur pour exprimer une surprise ou laisser l’autre réagir : « …, dis donc », « c’est que… ».",[["저도 그런 사람을 만나고 싶은데요!","Moi aussi, j’aimerais rencontrer quelqu’un comme ça !"],["발음이 정말 좋은데요!","Ta prononciation est vraiment bonne, dis donc !"]]]]],[10,[["-는/(으)ㄴ 편이다","Dire qu’on est « plutôt » d’un côté. Verbe : -는 편이다 ; adjectif : -(으)ㄴ 편이다.",[["산악자전거는 조금 위험한 편이에요.","Le VTT est plutôt dangereux."],["저는 일찍 일어나는 편이에요.","Je me lève plutôt tôt."]]],["-게 (le but)","« Pour que », « de façon à » : racine + 게.",[["늦지 않게 일찍 출발하세요.","Partez tôt pour ne pas être en retard."],["감기에 걸리지 않게 따뜻하게 입으세요.","Habille-toi chaudement pour ne pas attraper froid."]]]]],[11,[["-아/어 (le style familier, 반말)","Avec un ami proche ou quelqu’un de plus jeune, on enlève 요 : 해요 → 해, 먹어요 → 먹어. 이에요/예요 devient 이야/야.",[["처음에는 모르는 게 많아서 답답했어.","Au début, il y avait plein de choses que je ne savais pas, c’était frustrant."],["오늘 정말 재미있었어.","C’était vraiment amusant aujourd’hui."]]],["에는, 에서는","On ajoute 는 à 에 ou 에서 pour mettre en avant ou comparer : « au début, en tout cas… », « en Corée, … ».",[["처음에는 실수를 많이 했어요.","Au début, j’ai fait beaucoup d’erreurs."],["한국에서는 생일에 미역국을 먹어요.","En Corée, on mange une soupe aux algues pour son anniversaire."]]]]],[12,[["처럼","« Comme » : nom + 처럼.",[["난 너처럼 카페를 하고 싶어.","Je veux tenir un café, comme toi."],["엄마처럼 친절한 사람이 되고 싶어요.","Je veux devenir quelqu’un de gentil, comme ma mère."]]],["-게 되다","Un changement qui arrive, souvent sans l’avoir prévu : « finir par… », « en venir à… ».",[["한국 드라마를 보다가 한국어를 공부하게 됐어요.","C’est en regardant des dramas que j’en suis venu(e) à étudier le coréen."],["회사 때문에 서울에 살게 됐어요.","À cause du travail, je me suis retrouvé(e) à vivre à Séoul."]]]]]];
const GT_2B={"1":["-(으)ㄹ래요? demande ce que l’autre veut ; -(으)ㄹ게요 promet ce que je vais faire.","-(으)ㄹ게요 ne s’emploie qu’avec « je » : on ne l’utilise pas pour parler de quelqu’un d’autre."],"2":["에서부터 … 까지 = « de … jusqu’à … » : 집에서부터 학교까지.","-(으)ㄹ + nom parle de l’avenir : 할 일 (une chose à faire), 갈 곳 (un endroit où aller)."],"3":["Avec l’honorifique, certains verbes changent : 있다 → 계시다, 먹다 → 드시다, 자다 → 주무시다.","On ne met jamais -(으)시- pour soi-même : 제가 갈게요, pas 제가 가실게요."],"4":["Avec -다가, la première action s’arrête quand la seconde arrive.","-아/어 주세요 est plus poli qu’un simple -(으)세요 quand on demande un service."],"5":["-네요 réagit à ce qu’on découvre maintenant, pas à une information déjà connue.","Entre amis, -지 마세요 devient -지 마."],"6":["On répond : 네, -아도/어도 돼요 (oui, tu peux) ou 아니요, -(으)면 안 돼요 (non).","-(으)면 안 되다 est plus fort que -지 마세요 : c’est une règle."],"7":["한테서 est plus oral, 에게서 plus écrit ; 께 s’utilise pour une personne âgée ou respectée.","Avec -(으)니까 « découverte », la seconde partie est souvent au passé : 있었어요, 이었어요."],"8":["밖에 va toujours avec une négation : 하나밖에 없어요, jamais 하나밖에 있어요.","Au passé, on dit -았/었는데 : 길었는데, 좋아했는데."],"9":["-기 때문에 ne s’utilise pas avec un ordre ou une proposition : on prend alors -(으)니까.","-는데요 adoucit la phrase et laisse l’autre réagir."],"10":["-는/(으)ㄴ 편이다 nuance : ce n’est pas absolu, c’est « plutôt ».","-게 exprime le but : 늦지 않게 (pour ne pas être en retard)."],"11":["Le 반말 est réservé aux proches et aux plus jeunes : avec un professeur, garde -아요/어요.","Au 반말, 이에요/예요 devient 이야/야 : 학생이야, 친구야."],"12":["처럼 se colle directement au nom : 너처럼, 엄마처럼.","-게 되다 insiste sur le résultat d’un changement : 좋아하게 됐어요 (j’ai fini par aimer)."]};

const GR_3A=[[1,[["-니?, -자 (style familier)","Entre proches, -니? pose une question (avec une touche affectueuse) et -자 propose : « on… ? », « allons… ».",[["그동안 어떻게 지냈니?","Comment tu vas depuis tout ce temps ?"],["주말에 같이 영화 보자.","Allons voir un film ce week-end."]]],["-아/어 보이다","Une impression d’après l’apparence : adjectif + 아/어 보이다 = « avoir l’air ».",[["요즘 피곤해 보여요.","Tu as l’air fatigué(e) ces temps-ci."],["이 옷이 비싸 보여요.","Ce vêtement a l’air cher."]]]]],[2,[["-는다고/ㄴ다고/다고 하다","Rapporter ce que quelqu’un a dit. Verbe : -는다고 (après une consonne) ou -ㄴ다고 (après une voyelle) ; adjectif : -다고 ; nom : (이)라고. Au passé : -았/었다고.",[["친구가 요즘 좀 바쁘다고 해요.","Mon ami dit qu’il est un peu occupé ces temps-ci."],["언니가 다음 달에 결혼한다고 했어요.","Ma sœur m’a dit qu’elle se marie le mois prochain."]]],["-나 보다 / -(으)ㄴ가 보다","Une supposition d’après un indice : « on dirait que… ». Verbe (et 있다, 없다) : -나 보다 ; adjectif : -(으)ㄴ가 보다.",[["불이 꺼져 있네요. 집에 아무도 없나 봐요.","Les lumières sont éteintes. On dirait qu’il n’y a personne."],["사람이 많아요. 그 식당이 맛있나 봐요.","Il y a beaucoup de monde, ce restaurant doit être bon."]]]]],[3,[["-(으)ㄹ까 하다","Un projet encore hésitant : « je pense peut-être… ».",[["이번에 이사를 할까 해요.","Je pense peut-être déménager cette fois-ci."],["주말에 집들이를 할까 해요.","Je pense peut-être pendre la crémaillère ce week-end."]]],["-지만 않으면","« Du moment que… ne… pas », « tant que… ne… pas » : la seule chose qui poserait problème.",[["월세가 비싸지만 않으면 이 집이 좋아요.","Du moment que le loyer n’est pas trop cher, cette maison me plaît."],["비가 오지만 않으면 괜찮아요.","Tant qu’il ne pleut pas, ça va."]]]]],[4,[["-고 나서","« Après avoir… » : la première action est terminée, puis vient la seconde.",[["세탁기를 돌리고 나서 청소를 해요.","Je lance la machine, puis je fais le ménage."],["밥을 먹고 나서 설거지를 했어요.","Après avoir mangé, j’ai fait la vaisselle."]]],["-(으)ㄹ 테니까","« Moi, je vais…, alors… » : on annonce ce qu’on va faire pour demander ou proposer quelque chose à l’autre.",[["나는 거실 청소를 할 테니까 넌 주방 청소를 해 줘.","Je m’occupe du salon, alors toi, fais la cuisine."],["제가 빨래를 널 테니까 쓰레기 좀 버려 주세요.","J’étends le linge, alors jetez les déchets, s’il vous plaît."]]]]],[5,[["-아/어 보니까","Après avoir essayé ou fait quelque chose, on découvre : « j’ai essayé, et… ».",[["입어 보니까 사이즈가 안 맞아요.","Je l’ai essayé, et ce n’est pas la bonne taille."],["집에 와서 보니까 얼룩이 있었어요.","En rentrant à la maison, j’ai vu qu’il y avait une tache."]]],["-(으)려면","« Si tu veux… », « pour… » : la condition pour atteindre un but.",[["환불하려면 영수증이 필요합니다.","Pour vous faire rembourser, il faut le ticket de caisse."],["교환하려면 일주일 이내에 오세요.","Pour un échange, venez dans un délai d’une semaine."]]]]],[6,[["-잖아요","Rappeler quelque chose que l’autre sait déjà : « tu sais bien que… », « voyons… ».",[["어제 말했잖아요.","Je te l’ai dit hier, voyons."],["그 노트북은 자주 고장이 나잖아요.","Ce portable tombe souvent en panne, tu le sais bien."]]],["-(으)려다가","« J’allais…, mais finalement » : une intention qu’on abandonne en chemin.",[["새로 사려다가 수리해서 쓰고 있어요.","J’allais en racheter un neuf, mais je l’ai fait réparer."],["버스를 타려다가 걸어왔어요.","J’allais prendre le bus, mais je suis venu(e) à pied."]]]]],[7,[["-(으)ㄴ 지","Le temps écoulé depuis une action : racine + (으)ㄴ 지 + durée + 되다.",[["여자 친구하고 만난 지 곧 3년이 돼.","Ça va bientôt faire trois ans que je sors avec ma copine."],["한국어를 배운 지 6개월이 됐어요.","Ça fait six mois que j’apprends le coréen."]]],["-자고 하다","Rapporter une proposition : « il/elle a proposé de… ».",[["친구가 같이 외식을 하자고 했어요.","Mon ami a proposé qu’on mange au restaurant."],["언니가 어버이날에 꽃을 사자고 해요.","Ma sœur propose d’acheter des fleurs pour la fête des parents."]]]]],[8,[["-기 위해서","« Pour », « afin de » : le but. Racine + 기 위해서 ; avec un nom : nom + 을/를 위해서.",[["한글날을 기념하기 위해서 행사를 해요.","On organise un événement pour célébrer le jour du hangeul."],["대회에 나가기 위해서 매일 연습해요.","Je m’entraîne tous les jours pour participer au concours."]]],["-아야겠다/어야겠다","Une décision qu’on prend pour soi : « il faut que je… », « il va falloir… ».",[["신청서를 내일까지 제출해야겠어요.","Il faut que je rende le formulaire d’ici demain."],["연습을 많이 해야겠어요.","Il va falloir que je m’entraîne beaucoup."]]]]],[9,[["-아지다/어지다","Un changement d’état : adjectif + 아/어지다 = « devenir ».",[["비가 오면 오히려 기분이 좋아져요.","Quand il pleut, au contraire, je me sens mieux."],["날씨가 많이 따뜻해졌어요.","Il fait beaucoup plus doux."]]],["-는/(으)ㄴ 대신에","« Au lieu de », ou « en contrepartie ». Verbe : -는 대신에 ; adjectif : -(으)ㄴ 대신에 ; nom : 대신에.",[["밖에 나가는 대신에 집에서 영화를 봤어요.","Au lieu de sortir, j’ai regardé un film à la maison."],["이 집은 좁은 대신에 교통이 편리해요.","Cette maison est petite, mais en contrepartie elle est bien desservie."]]]]],[10,[["-도록 하다","Un conseil ou une consigne polie : « veillez à… ». Avec 저는, c’est une résolution.",[["오늘은 일찍 들어가도록 하세요.","Rentrez tôt aujourd’hui."],["약을 먹고 푹 쉬도록 하세요.","Prenez vos médicaments et reposez-vous bien."]]],["-아야/어야","Une condition indispensable : « il faut… pour que… », « seulement si… ».",[["푹 쉬어야 감기가 빨리 나아요.","Il faut bien se reposer pour guérir vite du rhume."],["연고를 발라야 덜 간지러워요.","Il faut mettre de la pommade pour que ça gratte moins."]]]]],[11,[["-다 보면","« À force de… » : en continuant une action, un résultat finit par arriver.",[["매일 연습하다 보면 잘하게 될 거예요.","À force de t’entraîner tous les jours, tu vas y arriver."],["운동을 하다 보면 스트레스가 풀려요.","À force de faire du sport, le stress s’en va."]]],["-더라고요","Raconter ce qu’on a soi-même vu ou ressenti : « j’ai remarqué que… », « j’ai trouvé que… ».",[["주말에는 집에서 쉬는 게 좋더라고요.","Le week-end, j’ai remarqué que c’est bien de se reposer à la maison."],["그 카페 커피가 정말 맛있더라고요.","Le café de cet endroit était vraiment bon, j’ai trouvé."]]]]],[12,[["-는다/ㄴ다/다 (style écrit)","Le style neutre des textes, journaux et journaux intimes. Verbe : -는다 (après une consonne) ou -ㄴ다 (après une voyelle) ; adjectif : -다 ; nom : -(이)다.",[["나는 주말마다 영화를 본다.","Je regarde un film tous les week-ends."],["이 영화는 정말 감동적이다.","Ce film est vraiment émouvant."]]],["-(으)라고 하다","Rapporter un ordre ou un conseil : « il/elle m’a dit de… ».",[["친구가 이 영화를 꼭 보라고 했어요.","Mon ami m’a dit de voir absolument ce film."] const GR_3B=[[1,[["-아도/어도","« Même si », « même en… » : racine + 아도/어도.",[["힘들어도 봉사 활동은 보람이 있어요.","Même si c’est dur, le bénévolat est gratifiant."],["바빠도 할머니께 전화했어요.","Même occupé(e), j’ai appelé ma grand-mère."]]],["-아/어 드리다","La forme respectueuse de -아/어 주다 : faire quelque chose pour une personne âgée ou respectée.",[["할머니께 책을 읽어 드렸어요.","J’ai lu un livre à ma grand-mère."],["제가 가방을 들어 드릴게요.","Je vais porter votre sac."]]]]],[2,[["-(으)ㄹ까 봐","« De peur que… », « au cas où… » : on agit par précaution.",[["표가 매진될까 봐 일찍 예매했어요.","J’ai réservé tôt de peur que ce soit complet."],["늦을까 봐 택시를 탔어요.","J’ai pris un taxi de peur d’être en retard."]]],["-(으)ㄹ 텐데","Une supposition qui amène un conseil ou une question : « ça doit être…, alors… ».",[["티켓을 구하는 게 쉽지 않았을 텐데 어떻게 구했어요?","Ça n’a pas dû être facile d’avoir des billets, comment as-tu fait ?"],["내일 비가 올 텐데 우산을 가져가세요.","Il va sûrement pleuvoir demain, prenez un parapluie."]]]]],[3,[["-거든요","Donner une explication que l’autre ne connaît pas : « c’est que… ».",[["오늘은 못 가요. 약속이 있거든요.","Je ne peux pas venir aujourd’hui, c’est que j’ai un rendez-vous."],["저는 매운 음식을 잘 먹어요. 고향 음식이 맵거든요.","Je mange bien épicé : c’est que la cuisine de chez moi est épicée."]]],["-는구나 / -구나","Une découverte, au style familier ou en se parlant à soi-même : « ah, tiens… ! ». Verbe : -는구나 ; adjectif : -구나.",[["매운 음식을 진짜 잘 먹는구나.","Ah, tu manges vraiment bien épicé !"],["날씨가 정말 춥구나.","Il fait vraiment froid !"]]]]],[4,[["-아/어 놓다","Faire quelque chose à l’avance et laisser le résultat prêt.",[["채소부터 씻어서 썰어 놓자.","Commençons par laver et couper les légumes."],["밥을 미리 해 놓았어요.","J’ai préparé le riz à l’avance."]]],["-(으)ㄴ 다음에","« Après avoir… » : racine + (으)ㄴ 다음에.",[["마늘을 다진 다음에 볶아요.","Après avoir haché l’ail, on le fait sauter."],["밥을 먹은 다음에 과일을 깎았어요.","Après le repas, j’ai épluché des fruits."]]]]],[5,[["-자마자","« Dès que » : racine + 자마자.",[["집에 오자마자 잠이 들었어요.","Je me suis endormi(e) dès que je suis rentré(e)."],["수업이 끝나자마자 친구에게 전화했어요.","J’ai appelé mon ami dès la fin du cours."]]],["-아/어 버리다","Une action terminée pour de bon, souvent avec un regret (ou un soulagement).",[["딴생각을 하다가 버스를 놓쳐 버렸어요.","Je pensais à autre chose et j’ai raté le bus."],["그릇을 깨뜨려 버렸어요.","J’ai cassé le bol."]]]]],[6,[["-았었/었었-","Un passé révolu, qui n’est plus vrai aujourd’hui : « avant, je… ».",[["어릴 때는 형하고 많이 싸웠었어요.","Petit(e), je me disputais souvent avec mon grand frère."],["예전에는 커피를 안 마셨었어요.","Avant, je ne buvais pas de café."]]],["-(으)ㄹ걸 그랬다","Un regret : « j’aurais dû… ». Avec -지 말다 : « je n’aurais pas dû… ».",[["제가 좀 참을걸 그랬어요.","J’aurais dû me retenir un peu."],["그 말을 하지 말걸 그랬어요.","Je n’aurais pas dû dire ça."]]]]],[7,[["-아/어 가지고","À l’oral : « …et puis » (une action qui prépare la suivante) ou « comme… » (une cause).",[["돈을 모아 가지고 자전거를 샀어요.","J’ai économisé et je me suis acheté un vélo."],["너무 피곤해 가지고 일찍 잤어요.","J’étais trop fatigué(e), alors je me suis couché(e) tôt."]]],["-는다거나 / -ㄴ다거나","Donner des exemples : « par exemple…, ou… ». Verbe : -는다거나 (après une consonne) ou -ㄴ다거나 (après une voyelle) ; adjectif : -다거나.",[["캠핑을 같이 간다거나 친목 모임을 해요.","On fait par exemple du camping ensemble, ou des rencontres conviviales."],["주말에는 책을 읽는다거나 영화를 봐요.","Le week-end, je lis un livre ou je regarde un film, par exemple."]]]]],[8,[["-느라고","Une activité qui prend du temps et empêche autre chose : « j’étais occupé(e) à…, alors… ». Même sujet.",[["일하느라고 바빠서 오랫동안 못 갔어요.","J’étais pris(e) par le travail, je n’ai pas pu y aller depuis longtemps."],["밀린 일을 처리하느라고 쉬지 못했어요.","J’étais occupé(e) à rattraper mon travail, je n’ai pas pu me reposer."]]],["-기는요","Répondre modestement à un compliment, ou contredire gentiment : « mais non… ».",[["잘하기는요. 아직 많이 부족해요.","Mais non, je suis loin d’être bon(ne)."],["바쁘기는요. 괜찮아요.","Occupé(e) ? Mais non, ça va."]]]]],[9,[["-는/(으)ㄴ 모양이다","Une supposition d’après ce qu’on observe : « on dirait que… ». Verbe : -는 모양이다 ; adjectif : -(으)ㄴ 모양이다.",[["밖에 비가 오는 모양이에요.","On dirait qu’il pleut dehors."],["두 사람이 많이 부러운 모양이에요.","On dirait q ,[8,[['-(으)ㄴ 후에','« Après avoir… ». Voyelle : -ㄴ 후에 ; consonne : -은 후에.',[['밥을 먹은 후에 이를 닦아요.','Après avoir mangé, je me brosse les dents.'],['수업이 끝난 후에 집에 가요.','Après les cours, je rentre à la maison.']]],['보다 (comparaison)','« Que ». 보다 se place après le terme de comparaison, souvent avec 더 (plus).',[['이번 여행은 지난번 여행보다 더 좋았어요.','Ce voyage était mieux que le dernier.'],['제주도는 서울보다 따뜻해요.','Jeju est plus chaud que Séoul.']]],['Prononciation : consonnes doubles','Une finale double (겹받침) ne prononce souvent qu’une seule consonne.',[['없다 → [업따]','넓다 → [널따]']]]]]
,[9,[['-지만','« Mais / bien que ». Se colle à la racine du verbe ou de l’adjectif, sans règle de voyelle.',[['한국어는 어렵지만 재미있어요.','Le coréen est difficile mais amusant.'],['감기에 걸렸지만 학교에 가요.','J’ai un rhume mais je vais à l’école.']]],['-아야/어야 되다','« Devoir / il faut ». -아야 après ㅏ ou ㅗ, -어야 sinon, 해야 pour 하다. Suivi de 되다 ou 하다.',[['집에서 푹 쉬어야 돼요.','Il faut bien se reposer à la maison.'],['약을 먹어야 해요.','Je dois prendre un médicament.']]],['Prononciation : consonnes doubles','D’autres finales doubles : on prononce l’une des deux.',[['읽다 → [익따]','앉다 → [안따]']]]]]
,[10,[['-기 전에','« Avant de… ». Racine + 기 전에, quelle que soit la dernière lettre.',[['학교에 가기 전에 수영을 해요.','Je nage avant d’aller à l’école.'],['자기 전에 이를 닦아요.','Je me brosse les dents avant de dormir.']]],['-아서/어서 (succession)','« Et puis » : deux actions liées, même sujet, la seconde suit la première. On ne met pas de temps passé devant -서.',[['도서관에 가서 책을 빌려요.','Je vais à la bibliothèque et j’y emprunte un livre.'],['친구를 만나서 영화를 봐요.','Je retrouve un ami puis nous voyons un film.']]],['Prononciation : consonnes doubles','Le ㅎ final se fond avec la consonne suivante.',[['많다 → [만타]','괜찮다 → [괜찬타]']]]]]
,[11,[['-(으)ㄹ 수 있다/없다','« Pouvoir / savoir ». Voyelle ou ㄹ : -ㄹ 수 있다 ; consonne : -을 수 있다. Négatif : 수 없다 (ou 못).',[['한국 음식을 만들 수 있어요.','Je sais faire la cuisine coréenne.'],['오늘은 시간이 없어서 갈 수 없어요.','Aujourd’hui, je n’ai pas le temps, je ne peux pas y aller.']]],['-고 있다','« Être en train de ». S’emploie aussi pour un état : porter un vêtement.',[['지금 친구를 기다리고 있어요.','J’attends un ami en ce moment.'],['모자를 쓰고 있어요.','Il porte un chapeau.']]]]]
,[12,[['에게 / 한테','« À (quelqu’un) ». 에게 est plus écrit, 한테 plus oral. Pour les personnes seulement ; pour un lieu, on utilise 에.',[['저는 지니 씨에게 펜을 선물할 거예요.','Je vais offrir un stylo à Jini.'],['친구한테 편지를 보내요.','J’envoie une lettre à un ami.']]],['-(으)니까 (cause)','« Puisque / comme ». Voyelle : -니까 ; consonne : -으니까. Contrairement à -아서/어서, il peut être suivi d’un ordre ou d’une proposition.',[['비가 오니까 우산을 가져가세요.','Comme il pleut, prenez un parapluie.'],['날씨가 좋으니까 같이 산책해요.','Il fait beau, allons nous promener ensemble.']]],['Prononciation : aspiration','ㄱ + ㅎ se prononce [ㅋ].',[['축하 → [추카]','좋고 → [조코]']]]]]

9:['-아야/어야 되다 et -아야/어야 하다 veulent dire la même chose : choisis celui que tu retiens le mieux.','-지만 se colle à la racine même au passé : 갔지만 (« je suis allé mais »).'],

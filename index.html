 $('#pn').innerHTML=`<h2 style="margin:0 0 12px;font-size:1.2em">Confort de lecture</h2><div class="g"><label>Police<select data-k="ff"><option value="sys">Standard</option><option value="atk">Lisible (Atkinson)</option><option value="lex">Lexend (lecture facilitée)</option></select></label><label>Thème<select data-k="th"><option value="auto">Automatique</option><option value="light">Clair</option><option value="dark">Sombre</option><option value="contrast">Contraste élevé</option></select></label>${rg('sz','Taille du texte (%)',100,160,10,a.sz||100)}${rg('lh','Interligne',1.4,2.2,.1,a.lh||1.5)}${rg('ls','Espace entre les lettres (em)',0,.15,.03,a.ls||0)}</div><p><label><input type="checkbox" data-k="nc" ${a.nc?'checked':''}> Masquer le mode Chrono (pas de pression de temps)</label></p><div class="bar"><button id="rs">Réinitialiser</button><button class="p" id="cl">Fermer</button></div>`;

[3,'저는 ___를 입어요.','Je mets un tee-shirt.','티셔츠'],[3,'이 ___가 너무 짧아요.','Cette jupe est trop courte.','치마'],[3,'결혼식에 ___을 입어요.','Je mets un costume pour un mariage.','정장'],
[4,'이 옷 ___이 얼마예요?','Quel est le prix de ce vêtement ?','가격'],[4,'더 큰 ___는 없어요?','Vous n’avez pas une taille plus grande ?','사이즈'],[4,'___이 오면 인사해요.','Quand un client arrive, je dis bonjour.','손님'],
[5,'___이 어디에 있어요?','Où sont les toilettes ?','화장실'],[5,'___를 타고 3층에 가요.','Je prends l’ascenseur pour monter au 3e étage.','엘리베이터'],[5,'___에서 약을 사요.','J’achète des médicaments à la pharmacie.','약국'],

[7,'여행 갈 때 ___을 가져가요.','J’emporte mon passeport en voyage.','여권'],[7,'바다에서 ___을 입어요.','Je mets un maillot de bain à la mer.','수영복'],[7,'제주도는 ___이에요.','Jeju est une île.','섬'],

[9,'___이 아파요.','J’ai mal à la gorge.','목'],[9,'___에 걸렸어요.','J’ai attrapé un rhume.','감기'],[9,'___을 많이 해서 목이 아파요.','Je tousse beaucoup, donc j’ai mal à la gorge.','기침'],
[10,'저는 ___를 해요.','Je fais du yoga.','요가'],[10,'저는 ___를 좋아해요.','J’aime la salade.','샐러드'],[10,'좋은 ___이 건강에 좋아요.','Les bonnes habitudes sont bonnes pour la santé.','습관'],
[11,'금요일에 ___이 있어요.','Vendredi, j’ai une réunion.','모임'],[11,'겨울에 ___를 타요.','En hiver, je fais du ski.','스키'],[11,'저는 노래를 부르고 ___을 춰요.','Je chante et je danse.','춤'],
[12,'친구에게 ___를 보내요.','J’envoie une lettre à un ami.','편지'],[12,'엄마에게 ___을 선물해요.','J’offre un portefeuille à maman.','지갑'],[12,'5월 8일은 ___이에요.','Le 8 mai, c’est la fête des parents.','어버이날']].filter(x=>A.some(w=>w.ko===x[3]&&w.l===x[0]));
function fin(s,n,v){set(`<div class='card c'><div class='mut'>Résultat</div><div class='big'>${s} / ${n}</div><p>${s/n>=.8?'Excellent !':'Continue, tu progresses.'}</p><button class='p' id='again'>Recommencer</button></div>`);$('#again').onclick=()=>go(v)}
// Phrases à trous
V.fill=()=>{const P=pool(),d=sh(EX.filter(x=>P.some(w=>w.ko===x[3]&&w.l===x[0])));if(!d.length){set(`<div class='card c'><p>Pas de phrases pour cette sélection : choisis des leçons entières (1 à 7, 8 à 12…).</p></div>`);return}K={d,i:0,s:0,n:Math.min(10,d.length)};fq()};
function fq(){const x=K.d[K.i],c=sh(A.filter(w=>w.ko!==x[3]&&!w.ko.endsWith('다')&&!w.ko.includes(' '))),o=sh([x[3],...[...new Set([...c.filter(w=>w.l===x[0]),...c].map(w=>w.ko))].slice(0,3)]);K.x=x;K.o=o;K.done=false;
 set(`<div class='card'><div class='bar' style='justify-content:space-between;margin:0'><span class='mut'>Phrase ${K.i+1} / ${K.n}</span><span class='mut'>Score : ${K.s}</span></div><div class='pb'><i style='width:${K.i/K.n*100}%'></i></div><div class='c'><div class='mut'>Complète la phrase</div><div class='bl ko'>${x[1].replace('___','<u>&emsp;&emsp;</u>')}</div><div class='mut'>${x[2]}</div></div>${o.map((t,i)=>`<button class='ch ko' data-i='${i}'>${t}</button>`).join('')}<div id='fbk'></div></div>`);
 document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>fp(+b.dataset.i))}
function fp(i){if(K.done)return;K.done=true;const x=K.x,ok=K.o[i]===x[3];rec(A.find(w=>w.ko===x[3]&&w.l===x[0]),ok);if(ok)K.s++;
 document.querySelectorAll('.ch').forEach((b,j)=>{b.disabled=true;if(K.o[j]===x[3])b.classList.add('good');else if(j===i)b.classList.add('bad')});
 $('#fbk').innerHTML=`<div class='fb ${ok?'good':'bad'}'>${ok?'Bien joué !':'Réponse : <b class="ko">'+x[3]+'</b>'}<div class='bl ko'>${x[1].replace('___','<b>'+x[3]+'</b>')}</div></div><div class='bar dock'><button class='p' id='nq'>${K.i+1>=K.n?'Résultat':'Suivante →'}</button></div>`;
 $('#nq').onclick=()=>{K.i++;K.i>=K.n?fin(K.s,K.n,'fill'):fq()}}

V.order=()=>{const d=sh(pool().filter(w=>[...w.ko].length>=2&&[...w.ko].length<=5&&!w.ko.includes(' ')));if(!d.length){set(`<div class='card c'><p>Pas assez de mots pour cet exercice.</p></div>`);return}K={d,i:0,s:0,n:Math.min(10,d.length)};od()};
function od(){const w=K.d[K.i],ch=[...w.ko];let t=sh(ch.map(c=>({c})));if(t.every((x,j)=>x.c===ch[j]))t=t.reverse();K.w=w;K.t=t;K.a=[];K.done=false;odr()}
function odr(){const w=K.w;set(`<div class='card c'><div class='bar' style='justify-content:space-between;margin:0'><span class='mut'>Mot ${K.i+1} / ${K.n}</span><span class='mut'>Score : ${K.s}</span></div><div class='pb'><i style='width:${K.i/K.n*100}%'></i></div><div class='mut'>Remets les syllabes dans l’ordre</div><div class='bl'>${w.fr}</div><div class='tiles ko' style='min-height:76px;border-bottom:2px dashed var(--line)'>${K.a.map((x,k)=>`<button data-a='${k}'>${x.c}</button>`).join('')}</div><div class='tiles ko'>${K.t.map((x,k)=>`<button data-t='${k}' ${K.a.includes(x)?'hidden':''}>${x.c}</button>`).join('')}</div><div id='fbk'></div></div>`);
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(K.done)return;K.a.push(K.t[+b.dataset.t]);K.a.length===K.t.length?odc():odr()});
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(K.done)return;K.a.splice(+b.dataset.a,1);odr()})}
function odc(){const w=K.w,ok=K.a.map(x=>x.c).join('')===w.ko;K.done=true;rec(w,ok);if(ok)K.s++;odr();
 $('#fbk').innerHTML=`<div class='fb ${ok?'good':'bad'}'>${ok?'Correct !':'Réponse : <b class="ko">'+w.ko+'</b>'}</div><div class='bar dock'><button class='p' id='nq'>${K.i+1>=K.n?'Résultat':'Suivant →'}</button></div>`;speak(w.ko);$('#nq').onclick=()=>{K.i++;K.i>=K.n?fin(K.s,K.n,'order'):od()}}

V.sheet=()=>{const P=new Set(pool().map(w=>w.k));
 const body=DATA.map(L=>{const ws=A.filter(w=>w.l===L.lesson&&P.has(w.k));if(!ws.length)return'';return `<div class='lh'>${L.lesson} 과 · <span class='ko'>${L.title}</span></div><div class='sh'>${ws.map(w=>`<button class='w ${S.hl[w.k]?'hl':''} ${learned(w)?'au':''}' data-i='${A.indexOf(w)}'><b class='ko'>${w.ko}</b> <span class='f mut'>${w.fr}</span></button>`).join('')}</div>`}).join('');
 set(`<div class='card'><h2 style='margin:0 0 6px;font-size:1.2em'>Fiche de vocabulaire (Sejong 1B)</h2><p class='mut' style='margin:0 0 6px'>Touche un mot pour le surligner. Les mots que tu as réussis 2 fois dans les exercices passent en vert tout seuls.</p><p class='lg' style='margin:0 0 10px'><span><i style='background:#ffe27a'></i>surligné par moi</span> &nbsp; <span><i style='background:var(--ok);border:1px solid var(--okt)'></i>acquis automatiquement</span></p><div class='bar'><label><input type='checkbox' id='hd' ${S.hide?'checked':''}> Cacher les traductions (touche un mot pour la voir)</label><label><input type='checkbox' id='hk' ${S.hidek?'checked':''}> Cacher le coréen : je pars du français et je retrouve le mot</label><button id='rh'>Effacer mes surlignages</button></div><div id='shb' class='${S.hide?'hide':''} ${S.hidek?'hidek':''}'>${body}</div></div>`);
 $('#shb').onclick=e=>{const b=e.target.closest('.w');if(!b)return;const w=A[+b.dataset.i];if(S.hide||S.hidek)b.classList.toggle('show');else{if(S.hl[w.k])delete S.hl[w.k];else S.hl[w.k]=1;save();b.classList.toggle('hl',!!S.hl[w.k])}};

// Écriture de phrases entières
function wt(){return `<div class='bar' style='justify-content:center;margin-bottom:10px'><button data-wm='w' class='${S.wm!=='s'?'on':''}'>Mots</button><button data-wm='s' class='${S.wm==='s'?'on':''}'>Phrases entières</button></div>`}
const norm=s=>s.replace(/[ \s.,!?'’]/g,'');
function lev(a,b){const m=[...a],n=[...b];let p=Array.from({length:n.length+1},(_,j)=>j);for(let i=1;i<=m.length;i++){const c=[i];for(let j=1;j<=n.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(m[i-1]===n[j-1]?0:1));p=c}return p[n.length]}
function WS(){const P=pool(),d=sh(EX.filter(x=>P.some(w=>w.ko===x[3]&&w.l===x[0])));if(!d.length){set(`<div class='card c'>${wt()}<p>Pas de phrases pour cette sélection : choisis des leçons entières (1 à 7, 8 à 12…).</p></div>`);return}K={d,i:0,s:0,n:Math.min(10,d.length),hint:0};ws()}
function ws(){const x=K.d[K.i],full=x[1].replace('___',x[3]),w=A.find(w=>w.ko===x[3]&&w.l===x[0]);K.done=false;
 set(`<div class='card c'>${wt()}<div class='bar' style='justify-content:space-between;margin:0'><span class='mut'>Phrase ${K.i+1} / ${K.n}</span><span class='mut'>Score : ${K.s}</span></div><div class='pb'><i style='width:${K.i/K.n*100}%'></i></div><div class='mut'>Écris cette phrase en coréen :</div><div class='bl'>${x[2]}</div><input type='text' id='wi' aria-label='Ta phrase en coréen' class='ko' lang='ko' autocomplete='off' autocapitalize='off' spellcheck='false' placeholder='한국어 문장'><div id='fbk'></div><div class='bar dock'><button id='ht'>💡 Mot clé</button><button class='p' id='ck'>Vérifier</button></div></div>`);
 const inp=$('#wi');inp.focus();
 $('#ht').onclick=()=>{K.hint=1;$('#fbk').innerHTML=`<div class='fb'>Mot clé : <b class='ko'>${x[3]}</b> (${w.fr})</div>`};
 const chk=()=>{if(K.done){K.i++;K.i>=K.n?fin(K.s,K.n,'write'):ws();return}const v=inp.value,dist=lev(norm(v),norm(full)),ok=dist===0;K.done=true;rec(w,ok&&!K.hint);K.hint=0;if(ok)K.s++;
  $('#fbk').innerHTML=`<div class='fb ${ok?'good':'bad'}'>${ok?'Parfait !':dist<=2?'Presque ! Compare :':'Pas tout à fait.'}<div class='bl ko'>${full}</div>${ok?'':`<div class='mut ko'>Ta réponse : ${v.replace(/</g,'&lt;')||'—'}</div>`}</div>`;$('#ck').textContent='Suivant →'};
 $('#ck').onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()}}
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-wm]');if(b){S.wm=b.dataset.wm;save();go('write')}});

$('#tb').onclick=()=>{S.a.th=isDark()?'light':'dark';save();apply();thb();if(!$('#pn').hidden)pn()};

thb();

function qt(){const q=S.qd||'mix',b=(v,l)=>`<button data-qd='${v}' class='${q===v?'on':''}' style='min-height:40px;padding:6px 12px'>${l}</button>`;return `<div class='bar' style='justify-content:center;margin-bottom:10px'>${b('mix','Mixte')}${b('kf','한국어 → FR')}${b('fk','FR → 한국어')}</div>`}
